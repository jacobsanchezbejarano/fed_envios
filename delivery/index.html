    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#18243a;background:#f3f6fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-width:320px}.app{max-width:1440px;margin:0 auto;padding:18px 22px 32px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand-icon{display:grid;place-items:center;flex:0 0 44px;height:44px;border:1px solid #dfe7f5;border-radius:13px;background:#fff;font-size:22px}.eyebrow{margin:0 0 2px;color:#6c7890;font-size:11px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}.topbar h1{margin:0;font-size:clamp(20px,3vw,27px);line-height:1.15;letter-spacing:-.025em}.summary-count{padding:8px 12px;border:1px solid #dfe5ef;border-radius:999px;background:#fff;color:#495872;font-size:13px;font-weight:650;white-space:nowrap}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.tabs{display:flex;gap:4px;padding:4px;border:1px solid #dce3ee;border-radius:12px;background:#e9eef6}.tab{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 16px;border:0;border-radius:9px;background:transparent;color:#53617a;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.tab[aria-selected="true"]{background:#fff;color:#1c2c46;box-shadow:0 1px 4px #152b4b1a}.tab-count{display:inline-grid;place-items:center;min-width:23px;height:22px;padding:0 6px;border-radius:99px;background:#eef2f8;color:#56647b;font-size:12px}.tab[aria-selected="true"] .tab-count{background:#eaf0ff;color:#3158c9}.start-pref{display:flex;align-items:center;gap:8px;color:#68758b;font-size:12px}.start-pref-label{white-space:nowrap}.start-options{display:flex;gap:4px;padding:3px;border:1px solid #dce3ee;border-radius:9px;background:#fff}.start-option{padding:6px 10px;border:0;border-radius:6px;background:transparent;color:#53617a;font:inherit;font-size:12px;font-weight:650;cursor:pointer}.start-option[aria-pressed="true"]{background:#eaf0ff;color:#294eb2}.panel{min-width:0}.map-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 1px 9px;color:#61708a;font-size:13px}.map-meta strong{color:#2d3b53}.map-frame{height:min(66vh,720px);min-height:420px;overflow:hidden;border:1px solid #d9e1ec;border-radius:15px;background:#e5ebf1;box-shadow:0 4px 18px #263d5b0b}.map-frame #deliveryMap{width:100%;height:100%}.map-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:11px 13px;border:1px solid #dfe5ee;border-radius:10px;background:#fff;color:#65728a;font-size:13px;line-height:1.4}.map-note[hidden]{display:none}.map-note button{flex:0 0 auto;padding:7px 10px;border:1px solid #d8e1f2;border-radius:8px;background:#f7f9ff;color:#3158c9;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.legend{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin:11px 2px;color:#65728a;font-size:12px}.legend-item{display:flex;align-items:center;gap:6px}.legend-dot{width:10px;height:10px;border-radius:50%;background:#3158c9}.legend-dot.done{background:#26975c}.legend-pin{font-size:14px}.store-card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;padding:12px 14px;border:1px solid #dfe5ee;border-radius:11px;background:#fff}.store-copy{display:flex;align-items:center;gap:10px;min-width:0}.store-copy strong{display:block;font-size:13px}.store-copy span{display:block;margin-top:2px;color:#748097;font-size:12px}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:9px 13px;border:1px solid transparent;border-radius:9px;font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}.button-primary{background:#3158c9;color:#fff}.button-primary:hover{background:#2649ad}.button-light{border-color:#d9e1ec;background:#fff;color:#34425a}.button-success{background:#e7f5ec;color:#17683c}.button-success:hover{background:#d7eedf}.button:disabled{opacity:.6;cursor:wait}.summary-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:12px 1px 14px}.summary-head h2{margin:0;font-size:19px}.summary-head p{margin:4px 0 0;color:#69768d;font-size:13px}.order-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:13px}.order-card{min-width:0;padding:16px;border:1px solid #dfe5ee;border-radius:14px;background:#fff;box-shadow:0 2px 8px #19305208}.order-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid #edf0f5}.order-heading h3{margin:0 0 3px;font-size:16px}.order-id{color:#79849a;font-size:11px}.badge{display:inline-flex;align-items:center;min-height:25px;padding:4px 9px;border-radius:999px;background:#fff2dc;color:#88510a;font-size:11px;font-weight:750;white-space:nowrap}.badge.done{background:#e5f4eb;color:#1c6a3f}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;padding:13px 0}.detail-label{display:block;margin-bottom:3px;color:#77839a;font-size:11px}.detail-value{color:#293750;font-size:13px;font-weight:650;overflow-wrap:anywhere}.comment{margin:0 0 12px;padding:10px 11px;border-radius:9px;background:#f6f8fb;color:#4c5a73;font-size:13px;line-height:1.45;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty,.error,.loading{padding:28px 18px;border:1px dashed #ccd6e4;border-radius:14px;background:#fff;text-align:center;color:#6a778e}.empty h3{margin:7px 0 4px;color:#25344d;font-size:17px}.empty p{margin:0;font-size:13px}.empty-icon{font-size:25px}.error{border-color:#f0c7c7;color:#9b2c2c}.hidden{display:none!important}.leaflet-popup-content-wrapper{border-radius:13px!important}.leaflet-popup-content{margin:13px!important;min-width:210px}.map-popup{font-family:Inter,system-ui,sans-serif;color:#24324a}.popup-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid #edf0f5}.popup-heading strong{font-size:15px}.popup-sub{margin-top:3px;color:#768198;font-size:11px}.popup-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;padding:10px 0}.popup-label{display:block;color:#7a869b;font-size:10px}.popup-value{display:block;margin-top:2px;color:#2e3b52;font-size:12px;font-weight:650;overflow-wrap:anywhere}.popup-comment{margin:0 0 9px;padding:8px;border-radius:7px;background:#f5f7fa;color:#536078;font-size:12px;line-height:1.4}.popup-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.popup-actions .button{min-height:35px;padding:7px 8px;font-size:11px}.popup-actions .button-success{grid-column:1/-1}.map-pin{display:grid;place-items:center;width:32px;height:38px;border:2px solid #fff;border-radius:50% 50% 50% 5px;background:#3158c9;color:#fff;font-size:17px;box-shadow:0 2px 7px #152b4b66;transform:rotate(-45deg)}.map-pin span{transform:rotate(45deg)}.map-pin.done{background:#26975c}.store-marker{display:grid;place-items:center;width:38px;height:38px;border:2px solid white;border-radius:50%;background:#ee8b2d;font-size:19px;box-shadow:0 2px 8px #152b4b66}.leaflet-div-icon{background:transparent;border:0}@media(max-width:640px){.app{padding:12px 12px calc(18px + env(safe-area-inset-bottom))}.topbar{margin:3px 0 12px}.brand-icon{flex-basis:40px;height:40px}.toolbar{align-items:stretch;gap:8px}.tabs{flex:1;display:grid;grid-template-columns:1fr 1fr}.tab{min-height:44px;padding:8px 9px}.start-pref{justify-content:space-between;padding:2px 1px}.map-meta{font-size:12px}.map-frame{height:59vh;min-height:370px;max-height:680px;border-radius:12px}.map-note{align-items:flex-start}.store-card{align-items:flex-start}.store-card .button{min-height:36px;padding:7px 9px;font-size:11px}.summary-head{align-items:flex-start}.order-list{grid-template-columns:1fr}.order-card{padding:14px}.actions .button{flex:1 1 135px}.leaflet-popup-content{min-width:190px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-icon" aria-hidden="true">📦</div><div><p class="eyebrow">Ruta de entrega</p><h1 id="deliveryName">Mis pedidos</h1></div></div>
      <div id="summaryCount" class="summary-count" aria-live="polite">Cargando…</div>
    </header>
    <div class="toolbar">
      <nav class="tabs" role="tablist" aria-label="Vista de pedidos">
        <button id="mapTab" class="tab" type="button" role="tab" aria-selected="true" aria-controls="mapPanel">🗺️ Mapa <span id="mapCount" class="tab-count">0</span></button>
        <button id="summaryTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="summaryPanel">☷ Resumen <span id="summaryTabCount" class="tab-count">0</span></button>
      </nav>
      <div class="start-pref" aria-label="Seleccionar pestaña inicial">
        <span class="start-pref-label">Al abrir:</span>
        <div class="start-options">
          <button class="start-option" type="button" data-start-view="map" aria-pressed="true">Mapa</button>
          <button class="start-option" type="button" data-start-view="summary" aria-pressed="false">Resumen</button>
        </div>
      </div>
    </div>

    <section id="mapPanel" class="panel" role="tabpanel" aria-labelledby="mapTab">
      <div class="map-meta"><span><strong>Pedidos en el mapa</strong> · Toca un marcador para ver sus datos y acciones</span><span id="mapLocatedCount"></span></div>
      <div class="map-frame"><div id="deliveryMap" aria-label="Mapa de pedidos asignados y ubicación del local"></div></div>
      <div class="map-note" id="mapNote" hidden><span id="mapNoteText"></span><button id="showSummaryButton" type="button">Ver resumen</button></div>
      <div class="legend" aria-label="Leyenda del mapa">
        <span class="legend-item"><i class="legend-dot"></i> Pendiente</span>
        <span class="legend-item"><i class="legend-dot done"></i> Entregado</span>
        <span class="legend-item"><i class="legend-pin">📍</i> Local</span>
      </div>
      <div id="storeCard" class="store-card" hidden>
        <div class="store-copy"><span aria-hidden="true">📍</span><div><strong>Local</strong><span>Punto de retiro</span></div></div>
        <a id="storeLink" class="button button-light" target="_blank" rel="noopener">Navegar al local ↗</a>
      </div>
    </section>

    <section id="summaryPanel" class="panel hidden" role="tabpanel" aria-labelledby="summaryTab">
      <div class="summary-head"><div><h2>Resumen de pedidos</h2><p>Información y accesos rápidos para tu ruta.</p></div></div>
      <div id="ordersList" class="order-list" aria-live="polite"><div class="loading">Cargando pedidos…</div></div>
    </section>
  </main>
  <script src="../scripts/api_pedidos_delivery.js"></script>
</body>
</html>
